name: hf_uploader
version: "3.0.0"
author: WikioApps
entry: hf_uploader.py
repository: https://github.com/WikioApps/hf
min_bot_version: "3.1.9"
description: Native WZML-X download/ZIP/7Z and Hugging Face mirror uploads, with persistent Telegram file-explorer pagination
tags: [huggingface, mirror, dataset, archive, wzm3]
python_dependencies:
  - huggingface_hub==0.36.0
commands:
  - name: hfmirror
    handler: hfmirror_command
    aliases: [hfm]
    access: owner
    description: Mirror via native WZML engines to Hugging Face
    usage: /hfmirror LINK [-e [PASSWORD]] [-z [PASSWORD]] [-s] [-j] [-up FOLDER]
callbacks:
  - pattern: "^hfpg [0-9]+ [0-9]+$"
    handler: hfpage_callback
    access: owner
    description: Browse Hugging Face remote files without database records
config_schema:
  repo_id:
    type: string
    default: ""
    description: Hugging Face username/repository, or set HF_REPO_ID in host env
  repo_type:
    type: string
    default: dataset
    choices: [model, dataset]
  branch:
    type: string
    default: main
  folder:
    type: string
    default: ""
    description: Default destination folder on HF
  private:
    type: boolean
    default: true
    description: Only used when creating a new repository
  collision:
    type: string
    default: rename
    choices: [rename, overwrite, skip]
  max_files:
    type: integer
    default: 5000
    min: 1
    max: 100000
    description: Limit extracted files per task; directory listing has Prev/Next pages
